name: terraform-apply

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build fix zips
        run: bash scripts/build-fixes.sh

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AG_TF_APPLY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Terraform fmt
        run: terraform -chdir=infra fmt -check -recursive

      - name: Terraform init
        run: |
          terraform -chdir=infra init -input=false \
            -backend-config="bucket=${{ vars.AG_TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.AG_TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AG_TF_STATE_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.AG_TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform validate
        run: terraform -chdir=infra validate

      - name: Terraform apply
        env:
          TF_VAR_permissions_boundary_arn: ${{ vars.AG_FIX_BOUNDARY_ARN }}
        run: terraform -chdir=infra apply -input=false -auto-approve
